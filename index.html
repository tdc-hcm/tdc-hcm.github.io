    $('submit-content').innerHTML = shown > 0 ? html : '<div class="state-msg"><div class="icon">&#128269;</div>Không tìm thấy dự án phù hợp.</div>';
    var inputs = document.querySelectorAll('#submit-content textarea.edit-input');
    for (var k = 0; k < inputs.length; k++) {
      inputs[k].addEventListener('input', onEditFieldChange);
      autoResizeTextarea(inputs[k]); // Kích thước ban đầu khớp nội dung đã có sẵn, không chờ gõ phím
    }
    var chips = document.querySelectorAll('#submit-content .priority-chip');
    for (var c = 0; c < chips.length; c++) chips[c].addEventListener('click', onEditFieldChange);
    var bools = document.querySelectorAll('#submit-content .bool-input');
    for (var b = 0; b < bools.length; b++) bools[b].addEventListener('change', onEditFieldChange);
    // Giữ nguyên trạng thái khóa (nếu đang có 1 lượt gửi chạy dở) khi render lại danh sách — ví
    // dụ người dùng gõ tìm kiếm trong lúc đang chờ server phản hồi.
    if (submitInFlight) setSubmitFieldsDisabled_(true);
  }

  function onEditFieldChange(e) {
    var el = e.target;
    if (el.tagName === 'TEXTAREA') autoResizeTextarea(el);
    var projectId = el.getAttribute('data-project');
    var field = el.getAttribute('data-field');
    // Checkbox (field "boolean") gửi giá trị boolean THẬT (không phải chuỗi "true"/"false") để
    // khi ghi lên NHAPBC (webviewSubmitReports -> setValue) ô vẫn là checkbox tick được, không
    // biến thành chữ "true" trên Sheet.
    var value = (el.type === 'checkbox') ? el.checked : ((el.tagName === 'BUTTON') ? el.getAttribute('data-value') : el.value);
    var proj = null;
    for (var i = 0; i < submitProjectsResp.projects.length; i++) {
      if (submitProjectsResp.projects[i].id === projectId) { proj = submitProjectsResp.projects[i]; break; }
    }
    if (!pendingEdits[projectId]) pendingEdits[projectId] = {};
    pendingEdits[projectId][field] = value;

    // Nếu sửa lại về đúng giá trị gốc ở MỌI trường, bỏ khỏi pendingEdits (không còn "đã sửa").
    // So sánh qua String(...) vì proj.values[fld] luôn là chuỗi (server .toString()) trong khi
    // pendingEdits có thể chứa boolean thật (checkbox) — so trực tiếp !== sẽ luôn coi là "đã sửa"
    // dù người dùng bấm đi bấm lại về đúng trạng thái cũ.
    var stillDirty = !proj;
    if (proj) {
      for (var f = 0; f < submitProjectsResp.fields.length; f++) {
        var fld = submitProjectsResp.fields[f];
        var val = pendingEdits[projectId][fld] !== undefined ? pendingEdits[projectId][fld] : (proj.values[fld] || '');
        if (String(val) !== String(proj.values[fld] || '')) { stillDirty = true; break; }
      }
    }
    if (!stillDirty) delete pendingEdits[projectId];

    if (el.tagName === 'BUTTON') {
      var group = el.parentElement;
      var groupChips = group.querySelectorAll('.priority-chip');
      for (var gi = 0; gi < groupChips.length; gi++) groupChips[gi].classList.toggle('active', groupChips[gi] === el);
    }

    var card = el.closest('.edit-card');
    if (card) {
      card.classList.toggle('dirty', !!pendingEdits[projectId]);
      var badge = card.querySelector('.dirty-badge');
      if (pendingEdits[projectId] && !badge) {
        card.querySelector('.edit-card-head').insertAdjacentHTML('beforeend', '<span class="dirty-badge">Đã sửa</span>');
      } else if (!pendingEdits[projectId] && badge) {
        badge.remove();
      }
    }
    updateSubmitBar();
  }

  function updateSubmitBar() {
    var count = Object.keys(pendingEdits).length;
    $('submit-count').textContent = count;
    $('submit-bar').style.display = count > 0 ? 'block' : 'none';
  }

  // Khóa/mở toàn bộ ô nhập của Tab Gửi báo cáo (textarea/chip/checkbox) — tách riêng khỏi nút Gửi
  // để còn gọi lại được từ renderSubmitFiltered() (giữ trạng thái khóa xuyên suốt kể cả khi người
  // dùng gõ tìm kiếm làm render lại danh sách trong lúc đang chờ server).
  function setSubmitFieldsDisabled_(disabled) {
    var els = document.querySelectorAll('#submit-content textarea.edit-input, #submit-content .priority-chip, #submit-content .bool-input');
    for (var i = 0; i < els.length; i++) els[i].disabled = disabled;
  }

  function doSubmitReports() {
    var edits = Object.keys(pendingEdits).map(function (id) { return { id: id, values: pendingEdits[id] }; });
    if (edits.length === 0) return;
    // Chốt chặn KHÔNG cho gửi chồng lần 2 khi lần trước còn đang chạy — server (Control) xử lý
    // 1 lượt gửi mất TỰ NHIÊN khoảng 30-40s (ghi RAM + render INBC + render THBC), không phải lỗi.
    // Trước đây không có chốt này, người dùng thấy màn hình chờ lâu tưởng bị treo nên bấm gửi lại
    // nhiều lần, tạo ra nhiều request CHỒNG CHÉO tranh chấp khóa (LockService) của Control, làm
    // mọi thứ càng chậm thêm và có lượt bị bỏ dở giữa chừng (lỗi user phản ánh 2026-07-19, xác
    // nhận qua sheet DEBUG_LOG: 3 lượt gửi cho BC.BIM chồng lên nhau trong vòng 15 giây).
    if (submitInFlight) { showToast('Đang xử lý lượt gửi trước, vui lòng đợi...', true); return; }
    submitInFlight = true;
    var btn = $('submit-send-btn');
    btn.disabled = true;
    // Chỉ đổi chữ của #submit-label — KHÔNG ghi đè textContent của CẢ nút, vì nút còn chứa
    // <span id="submit-count"> lồng bên trong. Ghi đè textContent của nút sẽ XÓA LUÔN span đó
    // (đổi thành chữ thường), khiến mọi lần cập nhật số đếm sau này không còn tác dụng — hiện lại
    // đúng số CŨ đã "đông cứng" từ trước (lỗi user phản ánh 2026-07-19: sau khi gửi xong vẫn thấy
    // "Gửi báo cáo (1)" dù đã gửi hết, đáng lẽ phải ẩn hẳn thanh này vì hết pendingEdits).
    $('submit-label').textContent = 'Đang xử lý...';
    setSubmitFieldsDisabled_(true); // Khóa toàn bộ ô nhập — không cho sửa tiếp/gửi chồng trong lúc server đang xử lý
    // Báo NGAY khi bấm (không chờ server phản hồi mới báo — server xử lý ~30-40s, chờ tới lúc đó
    // mới báo cảm giác chậm/không phản hồi). Dữ liệu ĐÃ được ghi vào NHAPBC ngay khi request này
    // gửi đi (webviewSubmitReports ghi trước, gọi API sau) nên báo "đã gửi" ngay là chính xác —
    // ô nhập vẫn khóa cho tới khi có phản hồi thật để phòng trường hợp gửi thất bại (user yêu cầu
    // 2026-07-19: cảnh báo 5s ngay khi bấm + khóa UI cho tới khi xử lý xong).
    showToast('Đã gửi báo cáo, hệ thống đang xử lý (khoảng 30-40s)...');
    callServer('webviewSubmitReports', [currentDeptCode, currentPassword, edits])
      .then(function (res) {
        submitInFlight = false;
        btn.disabled = false;
        $('submit-label').textContent = 'Gửi báo cáo';
        setSubmitFieldsDisabled_(false);
        if (!res.ok) { showToast(res.error || 'Gửi thất bại.', true); return; }
        // Phòng trường hợp người dùng đã ĐĂNG XUẤT trong lúc server còn đang xử lý (logout() xóa
        // submitProjectsResp về null) — callback này vẫn chạy khi phản hồi về tới, không được đụng
        // vào submitProjectsResp.projects nếu nó đã bị xóa (lỗi Reviewer phát hiện 2026-07-19).
        if (!submitProjectsResp) return;
        // Cập nhật NGAY giá trị gốc (baseline) từ chính dữ liệu vừa gửi thành công — KHÔNG gọi lại
        // loadMyProjects() để tải lại từ server nữa. Trước đây gọi lại ngay sau khi gửi, bắt người
        // dùng chờ THÊM 1 lượt tải nặng (mở lại file bộ phận, dò lại cấu hình) NGAY SAU lượt gửi
        // vốn đã chậm — đây chính là nguyên nhân gây cảm giác "treo" dẫn tới lỗi ở trên. Giá trị
        // mới nhất vốn đã có sẵn trong "edits" (chính là những gì người dùng vừa gõ), không cần
        // hỏi lại server.
        edits.forEach(function (edit) {
          var proj = null;
          for (var i = 0; i < submitProjectsResp.projects.length; i++) {
            if (submitProjectsResp.projects[i].id === edit.id) { proj = submitProjectsResp.projects[i]; break; }
          }
          if (proj) {
            // An toàn dù edit.values[f] là boolean thật (field kiểu checkbox) hay chuỗi: server
            // cũng dùng raw.toString() (Code.js webviewGetMyProjects) và JS Boolean.toString()
            // đều cho ra "true"/"false" chữ thường như nhau, nên mọi nơi so sánh sau này qua
            // String(...) vẫn nhất quán.
            Object.keys(edit.values).forEach(function (f) { proj.values[f] = edit.values[f]; });
          }
        });
        pendingEdits = {};
        renderSubmitFiltered();
        updateSubmitBar();
        // Không báo toast "thành công" lần nữa — đã báo ngay lúc bấm gửi ở trên rồi, chỉ báo LỖI
        // nếu có (res.ok === false ở nhánh trên) để không làm phiền thêm.
        // Nạp lại NGAY Tab Thống kê BC — báo cáo vừa gửi có thể đổi trạng thái Đúng giờ/Muộn
        // trong đó, nếu để cache cũ người dùng phải tự tải lại mới thấy (user yêu cầu 2026-07-19).
        if (currentCanViewTKBC) { tkbcResp = null; showTkbcTab(); }
      })
      .catch(function (err) {
        submitInFlight = false;
        btn.disabled = false;
        $('submit-label').textContent = 'Gửi báo cáo';
        setSubmitFieldsDisabled_(false);
        showToast('Lỗi kết nối: ' + err.message, true);
      });
  }

  // ---------------- TAB ƯU TIÊN (role "btgd") ----------------
  // Thay thế trải nghiệm sheet NhapUuTien + menu "Cập nhật ưu tiên" (BC.BTGĐ/UuTien.js). Luồng:
  // vào tab -> tải toàn bộ dự án (từ overviewResp đã có sẵn, KHÔNG đọc lại sheet THBC) + độ ưu
  // tiên hiện tại (webviewGetPriorityList) -> chạm chip 1-5/"Bỏ" để sửa (giữ tạm ở pendingPriority,
  // CHƯA gửi) -> bấm "Lưu thay đổi" 1 lần -> webviewSetPriority gửi TOÀN BỘ trạng thái (đúng hợp
  // đồng fullReplace của updatePriorityBTGD) rồi Control tự render lại THBC.

  function buildPriorityGroups_() {
    // Dùng ĐÚNG cấu trúc nhóm + thứ tự của overviewResp (giống hệt Tab Dự án — nhóm "CÁC DỰ ÁN
    // ƯU TIÊN" luôn ở đầu vì Control đã dựng sẵn vậy, xem Control/RENDER_THBC.js) thay vì tự sắp
    // xếp lại theo mức ưu tiên đang chọn (user yêu cầu 2026-07-19: "sắp xếp giống hệt Tab Dự án").
    // 1 dự án có thể xuất hiện 2 LẦN trong overviewResp (nhóm ghim + nhóm Ban gốc, giống lý do
    // dongBoDuAnUuTien phải loại trùng theo Mã dự án ở BC.BTGĐ/UuTien.js) — chỉ giữ lần gặp đầu
    // tiên, không thì 1 dự án có 2 bộ chip chỉnh ưu tiên riêng biệt, dễ gây nhầm lẫn.
    var seen = {};
    var groups = [];
    if (!overviewResp || !overviewResp.ok) return groups;
    for (var gi = 0; gi < overviewResp.groups.length; gi++) {
      var g = overviewResp.groups[gi];
      var groupProjects = [];
      for (var pi = 0; pi < g.projects.length; pi++) {
        var p = g.projects[pi];
        if (seen[p.id]) continue;
        seen[p.id] = true;
        groupProjects.push({ id: p.id, name: p.name });
      }
      if (groupProjects.length > 0) groups.push({ ban: g.ban, isPriority: g.isPriority, projects: groupProjects });
    }
    return groups;
  }

  function showPriorityTab() {
    if (priorityMapResp && priorityMapResp.ok) {
      renderPriorityFiltered();
      updatePriorityBar();
      return;
    }
    var myRequestId = ++priorityRequestId;
    $('priority-content').innerHTML = '<div class="skeleton"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>';
    $('search-input-priority').value = '';
    ensureOverview(function () {
      if (myRequestId !== priorityRequestId) return;
      if (!overviewResp.ok) {
        $('priority-content').innerHTML = '<div class="state-msg"><div class="icon">&#9888;</div>' + escapeHtml(overviewResp.error || 'Lỗi tải dữ liệu.') + '</div>';
        return;
      }
      callServer('webviewGetPriorityList', [currentPassword])
        .then(function (res) {
          if (myRequestId !== priorityRequestId) return;
          if (!res.ok) {
            $('priority-content').innerHTML = '<div class="state-msg"><div class="icon">&#9888;</div>' + escapeHtml(res.error || 'Lỗi tải dữ liệu.') + '</div>';
            return;
          }
          priorityMapResp = res;
          pendingPriority = {};
          for (var id in res.map) pendingPriority[id] = res.map[id];
          renderPriorityFiltered();
          updatePriorityBar();
        })
        .catch(function (err) {
          if (myRequestId !== priorityRequestId) return;
          $('priority-content').innerHTML = '<div class="state-msg"><div class="icon">&#9888;</div>Lỗi kết nối: ' + escapeHtml(err.message) + '</div>';
        });
    });
  }

  function renderPriorityFiltered() {
    if (!priorityMapResp || !priorityMapResp.ok) return;
    var q = $('search-input-priority').value.trim().toLowerCase();
    var groups = buildPriorityGroups_();
    var html = '';
    var totalShown = 0;
    for (var gi = 0; gi < groups.length; gi++) {
      var g = groups[gi];
      var matched = [];
      for (var pi = 0; pi < g.projects.length; pi++) {
        var p = g.projects[pi];
        if (q && !((p.name && p.name.toLowerCase().indexOf(q) !== -1) || (p.id && p.id.toLowerCase().indexOf(q) !== -1))) continue;
        matched.push(p);
      }
      if (matched.length === 0) continue;
      totalShown += matched.length;
      var banGroupId = 'priority-ban-group-' + gi;
      var isCollapsed = !q && collapsedBanGroups[g.ban];
      html += '<div class="ban-group' + (isCollapsed ? ' collapsed' : '') + '" id="' + banGroupId + '">';
      if (g.ban) {
        html += '<div class="ban-title-row' + (g.isPriority ? ' priority' : '') + '" data-ban-group="' + banGroupId + '" data-ban-name="' + escapeHtml(g.ban) + '">' +
          '<span class="ban-title' + (g.isPriority ? ' priority' : '') + '">' + escapeHtml(g.ban) + ' (' + matched.length + ')</span>' +
          '<svg class="ban-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M6 9l6 6 6-6"></path></svg>' +
          '</div>';
      }
      for (var k = 0; k < matched.length; k++) {
        var proj = matched[k];
        var val = pendingPriority[proj.id] || '';
        html += '<div class="priority-card' + (val ? ' set' : '') + '" data-project="' + escapeHtml(proj.id) + '">' +
          '<div class="priority-card-head"><div class="project-name">' + escapeHtml(proj.name) + '</div>' +
          '<div class="project-sub">' + escapeHtml(proj.id) + '</div></div>' +
          '<div class="priority-chips">';
        for (var lvl = 1; lvl <= 5; lvl++) {
          html += '<button class="priority-chip' + (val === String(lvl) ? ' active' : '') + '" data-value="' + lvl + '">' + lvl + '</button>';
        }
        html += '<button class="priority-chip clear' + (!val ? ' active' : '') + '" data-value="">Bỏ</button>';
        html += '</div></div>';
      }
      html += '</div>';
    }
    $('priority-content').innerHTML = totalShown > 0 ? html : '<div class="state-msg"><div class="icon">&#128269;</div>Không tìm thấy dự án phù hợp.</div>';
    var chips = document.querySelectorAll('#priority-content .priority-chip');
    for (var c = 0; c < chips.length; c++) chips[c].addEventListener('click', onPriorityChipClick);
    // Giữ nguyên trạng thái khóa (nếu đang có 1 lượt lưu chạy dở) khi render lại — ví dụ người
    // dùng gõ tìm kiếm trong lúc đang chờ server phản hồi.
    if (priorityInFlight) setPriorityFieldsDisabled_(true);
    var banTitles = document.querySelectorAll('#tab-priority .ban-title-row');
    for (var b = 0; b < banTitles.length; b++) {
      banTitles[b].addEventListener('click', function () {
        var banName = this.getAttribute('data-ban-name');
        collapsedBanGroups[banName] = !collapsedBanGroups[banName];
        $(this.getAttribute('data-ban-group')).classList.toggle('collapsed');
      });
    }
  }

  function setPriorityFieldsDisabled_(disabled) {
    var chips = document.querySelectorAll('#priority-content .priority-chip');
    for (var i = 0; i < chips.length; i++) chips[i].disabled = disabled;
  }

  function onPriorityChipClick(e) {
    var card = e.target.closest('.priority-card');
    var projectId = card.getAttribute('data-project');
    var value = e.target.getAttribute('data-value');
    pendingPriority[projectId] = value;
    card.classList.toggle('set', !!value);
    var chips = card.querySelectorAll('.priority-chip');
    for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('active', chips[i].getAttribute('data-value') === value);
    updatePriorityBar();
  }

  function updatePriorityBar() {
    var baseline = (priorityMapResp && priorityMapResp.ok) ? priorityMapResp.map : {};
    var changed = 0;
    var allIds = {};
    for (var id1 in baseline) allIds[id1] = true;
    for (var id2 in pendingPriority) allIds[id2] = true;
    for (var id in allIds) {
      if ((baseline[id] || '') !== (pendingPriority[id] || '')) changed++;
    }
    $('priority-count').textContent = changed;
    $('priority-bar').style.display = changed > 0 ? 'block' : 'none';
  }

  function doSavePriority() {
    var payload = [];
    for (var id in pendingPriority) {
      if (pendingPriority[id]) payload.push({ projectId: id, priority: pendingPriority[id] });
    }
    // Cùng cơ chế chống gửi chồng như Tab Gửi báo cáo (doSubmitReports) — updatePriorityBTGD mất
    // ~15-20s để xử lý xong (xác nhận qua DEBUG_LOG 2026-07-19).
    if (priorityInFlight) { showToast('Đang xử lý lượt lưu trước, vui lòng đợi...', true); return; }
    priorityInFlight = true;
    var btn = $('priority-save-btn');
    btn.disabled = true;
    // Chỉ đổi #priority-label, không ghi đè textContent của cả nút — cùng lý do như
    // submit-send-btn (tránh xóa mất <span id="priority-count"> lồng bên trong).
    $('priority-label').textContent = 'Đang xử lý...';
    setPriorityFieldsDisabled_(true);
    // Báo NGAY khi bấm, giống Tab Gửi báo cáo — không bắt chờ server mới thấy phản hồi.
    showToast('Đã gửi yêu cầu cập nhật ưu tiên, hệ thống đang xử lý (khoảng 15-20s)...');
    callServer('webviewSetPriority', [currentPassword, payload])
      .then(function (res) {
        priorityInFlight = false;
        btn.disabled = false;
        $('priority-label').textContent = 'Lưu thay đổi';
        setPriorityFieldsDisabled_(false);
        if (!res.ok) { showToast(res.error || 'Lưu thất bại.', true); return; }
        priorityMapResp = { ok: true, map: {} };
        for (var id in pendingPriority) if (pendingPriority[id]) priorityMapResp.map[id] = pendingPriority[id];
        updatePriorityBar();
        // Không báo toast "thành công" lần nữa — đã báo ngay lúc bấm lưu ở trên rồi.
        // Nạp lại danh sách dự án ngay (Control đã render xong sheet đích của BC.BTGĐ trước khi
        // trả kết quả về đây — xem getCanonicalThbcTarget_ ở Code.js) — để Tab Dự án tự cập nhật
        // đúng nhóm "CÁC DỰ ÁN ƯU TIÊN" mà KHÔNG bắt người dùng tải lại cả trang (lỗi user phản
        // ánh 2026-07-19: dự án mới ghim ưu tiên không hiện dù bấm tải lại nhiều lần, vì
        // overviewResp chỉ nạp 1 lần lúc đăng nhập và không tự làm mới sau đó).
        overviewResp = null;
        loadOverview();
      })
      .catch(function (err) {
        priorityInFlight = false;
        btn.disabled = false;
        $('priority-label').textContent = 'Lưu thay đổi';
        setPriorityFieldsDisabled_(false);
        showToast('Lỗi kết nối: ' + err.message, true);
      });
  }

  // ---------------- TAB THỐNG KÊ BC (role "manager"/"btgd") ----------------
  // Đọc trực tiếp file TKBC trung tâm (Code.js: webviewGetTKBC), tháng này + tháng trước, cấu
  // trúc CỐ ĐỊNH theo sheet "mm.yyyy" thật (xem parseTKBCSheet_).

  function showTkbcTab() {
    if (tkbcResp && tkbcResp.ok) {
      renderTkbc(); // Luôn vẽ ngay (dù dữ liệu là từ cache cũ hay đã tải thật trong phiên này)
      if (!tkbcNeedsRefresh) return; // Đã có bản MỚI trong phiên này rồi -> không tải lại (giữ đúng ý "chỉ tải 1 lần/phiên" cũ)
      // KHÔNG xóa cờ tkbcNeedsRefresh ở đây (trước khi biết fetch bên dưới có thành công hay
      // không) — nếu xóa sớm rồi lần tải làm mới NÀY lại lỗi mạng, cờ đã mất nên các lần vào tab
      // SAU sẽ không bao giờ thử tải lại nữa, kẹt vĩnh viễn ở cache cũ suốt phiên (Reviewer phát
      // hiện 2026-07-20). Chỉ xóa cờ trong nhánh .then() khi CHẮC CHẮN đã có dữ liệu mới thật.
    }
    var myRequestId = ++tkbcRequestId;
    if (!tkbcResp) $('tkbc-content').innerHTML = '<div class="skeleton"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>';
    callServer('webviewGetTKBC', [currentPassword])
      .then(function (res) {
        if (myRequestId !== tkbcRequestId) return;
        tkbcResp = res;
        if (res.ok) { saveCache_('tkbc', res); tkbcNeedsRefresh = false; }
        renderTkbc();
      })
      .catch(function (err) {
        if (myRequestId !== tkbcRequestId) return;
        if (tkbcResp && tkbcResp.ok) return; // Đã có cache đang hiện -> giữ nguyên, bỏ qua lỗi làm mới lần này (tkbcNeedsRefresh vẫn còn true -> tự thử lại ở lần vào tab tiếp theo)
        $('tkbc-content').innerHTML = '<div class="state-msg"><div class="icon">&#9888;</div>Lỗi kết nối: ' + escapeHtml(err.message) + '</div>';
      });
  }

  function renderTkbc() {
    if (!tkbcResp) return;
    if (!tkbcResp.ok) {
      $('tkbc-content').innerHTML = '<div class="state-msg"><div class="icon">&#9888;</div>' + escapeHtml(tkbcResp.error || 'Lỗi tải dữ liệu.') + '</div>';
      return;
    }
    if (!tkbcResp.months || tkbcResp.months.length === 0) {
      $('tkbc-content').innerHTML = '<div class="state-msg"><div class="icon">&#128203;</div>Chưa có dữ liệu thống kê.</div>';
      return;
    }
    var html = '';
    for (var m = 0; m < tkbcResp.months.length; m++) {
      var month = tkbcResp.months[m];
      html += '<div class="tkbc-month-title">' + escapeHtml(month.label) + '</div>';
      if (!month.departments || month.departments.length === 0) {
        html += '<div class="state-msg" style="padding:20px 24px;"><div class="icon">&#128203;</div>Chưa có dữ liệu.</div>';
        continue;
      }
      for (var d = 0; d < month.departments.length; d++) {
        var dept = month.departments[d];
        html += '<div class="tkbc-card">';
        html += '<div class="tkbc-card-head"><div class="tkbc-name">' + escapeHtml(dept.name) + '</div>' +
          (dept.timestamp ? '<div class="tkbc-timestamp">' + escapeHtml(dept.timestamp) + '</div>' : '') + '</div>';
        html += '<div class="tkbc-stats">' +
          '<span class="tkbc-stat-badge ok">Đúng giờ: ' + escapeHtml(dept.onTime) + (dept.onTimePct ? ' (' + escapeHtml(dept.onTimePct) + ')' : '') + '</span>';
        if (dept.late > 0) html += '<span class="tkbc-stat-badge bad">Muộn: ' + escapeHtml(dept.late) + (dept.latePct ? ' (' + escapeHtml(dept.latePct) + ')' : '') + '</span>';
        html += '</div>';
        html += '<div class="tkbc-days">';
        (month.dueDays || []).forEach(function (day) {
          var dInfo = dept.days ? dept.days[day] : null;
          var status = dInfo ? dInfo.status : '';
          var cls = 'tkbc-day';
          var label = '−';
          if (status === 'Đ') { cls += ' ontime'; label = 'Đ'; }
          else if (status === 'M') { cls += ' late'; label = 'M'; }
          else { cls += ' missed'; }
          // Thêm thứ trong tuần trước số ngày (vd "T4, 1") — user yêu cầu 2026-07-19, phải hiện
          // chung 1 dòng không xuống hàng (xem .tkbc-day .d-num white-space:nowrap ở CSS).
          var wd = (month.weekdays && month.weekdays[day]) ? month.weekdays[day] : '';
          var dayLabel = wd ? (wd + ', ' + day) : String(day);
          html += '<div class="' + cls + '"><div class="d-num">' + escapeHtml(dayLabel) + '</div><div class="d-status">' + label + '</div></div>';
        });
        html += '</div></div>';
      }
    }
    html += '<div class="tkbc-legend">' +
      '<span><span class="dot" style="background:var(--ok-border)"></span>Đúng giờ</span>' +
      '<span><span class="dot" style="background:var(--priority-border)"></span>Muộn</span>' +
      '<span><span class="dot" style="background:var(--bad-border)"></span>Chưa gửi</span>' +
      '</div>';
    $('tkbc-content').innerHTML = html;
  }

  // ---------------- TAB DANH SÁCH DA ----------------
  // Đọc trực tiếp Project_List (Control) — Code.js webviewGetProjectList giữ NGUYÊN thứ tự dòng
  // gốc, client KHÔNG tự sắp xếp lại.

  function showDanhSachDaTab() {
    if (projectListResp && projectListResp.ok) {
      renderDanhSachDaFiltered(); // Luôn vẽ ngay (dù dữ liệu là từ cache cũ hay đã tải thật trong phiên này)
      if (!projectListNeedsRefresh) return;
      // KHÔNG xóa cờ ở đây trước khi biết fetch có thành công hay không — cùng lý do tkbcNeedsRefresh
      // ở showTkbcTab() (Reviewer phát hiện 2026-07-20: xóa sớm + 1 lần lỗi mạng = kẹt cache cũ vĩnh viễn).
    }
    var myRequestId = ++projectListRequestId;
    if (!projectListResp) $('danhsachda-content').innerHTML = '<div class="skeleton"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>';
    callServer('webviewGetProjectList', [currentPassword])
      .then(function (res) {
        if (myRequestId !== projectListRequestId) return;
        projectListResp = res;
        if (res.ok) { saveCache_('projectList', res); projectListNeedsRefresh = false; }
        renderDanhSachDaFiltered();
      })
      .catch(function (err) {
        if (myRequestId !== projectListRequestId) return;
        if (projectListResp && projectListResp.ok) return; // projectListNeedsRefresh vẫn true -> tự thử lại ở lần vào tab tiếp theo
        $('danhsachda-content').innerHTML = '<div class="state-msg"><div class="icon">&#9888;</div>Lỗi kết nối: ' + escapeHtml(err.message) + '</div>';
      });
  }

  function renderDanhSachDaFiltered() {
    if (!projectListResp) return;
    if (!projectListResp.ok) {
      $('danhsachda-content').innerHTML = '<div class="state-msg"><div class="icon">&#9888;</div>' + escapeHtml(projectListResp.error || 'Lỗi tải dữ liệu.') + '</div>';
      return;
    }
    var q = $('search-input-danhsachda').value.trim().toLowerCase();
    var html = '';
    var shown = 0;
    for (var i = 0; i < projectListResp.projects.length; i++) {
      var p = projectListResp.projects[i];
      if (q && !((p.name && p.name.toLowerCase().indexOf(q) !== -1) || (p.id && p.id.toLowerCase().indexOf(q) !== -1))) continue;
      shown++;
      html += '<div class="da-card">' +
        '<div class="da-card-head"><span class="da-id-badge">' + escapeHtml(p.id) + '</span>' +
        '<div class="da-name">' + escapeHtml(p.name) + '</div></div>';
      if (p.ban || p.resp) {
        html += '<div class="da-meta">';
        if (p.ban) html += '<span>Ban: <b>' + escapeHtml(p.ban) + '</b></span>';
        if (p.resp) html += '<span>Bộ phận phụ trách: <b>' + escapeHtml(p.resp) + '</b></span>';
        html += '</div>';
      }
      html += '</div>';
    }
    $('danhsachda-content').innerHTML = shown > 0 ? html : '<div class="state-msg"><div class="icon">&#128269;</div>Không tìm thấy dự án phù hợp.</div>';
  }

  function logout() {
    localStorage.removeItem(STORAGE_KEY);
    currentPassword = '';
    currentRole = null; currentDeptCode = null; currentDeptName = null; currentCanViewTKBC = false; currentCanViewProjectList = false;
    $('password-input').value = '';
    $('login-error').textContent = '';
    // Xóa cache — nếu không, đăng nhập lại (không tải lại trang, app là SPA) sẽ hiện ngay dữ
    // liệu CŨ của phiên trước trong lúc chờ dữ liệu mới, vì ensureOverview/ensureDeptMap coi
    // biến cache khác null là "đã sẵn sàng" và gọi callback ngay lập tức.
    overviewResp = null; deptListResp = null; deptMapResp = null; deptDetailData = null;
    mainEntered = false;
    submitProjectsResp = null; pendingEdits = {}; submitInFlight = false;
    priorityMapResp = null; pendingPriority = {}; priorityInFlight = false;
    tkbcResp = null; tkbcNeedsRefresh = false;
    projectListResp = null; projectListNeedsRefresh = false;
    openProjectIds = {};
    searchWasOpenByTab = {};
    // Đăng xuất ngay TỪ màn hình chi tiết 1 bộ phận (nút "Đăng xuất" vẫn bấm được từ đó, không
    // nằm trong #dept-detail-area) để lại 1 mốc lịch sử THẬT chưa tiêu thụ (đã pushState lúc mở
    // chi tiết) — nếu không reset ở đây, đăng nhập lại lần sau enterMain()->switchTab() sẽ gọi
    // backFromDeptDetail() thấy deptDetailHistoryPushed vẫn true (sót từ phiên TRƯỚC) và tự ý gọi
    // history.back() ÉP người dùng lùi trang ngay sau khi vừa đăng nhập lại — thao tác họ không hề
    // yêu cầu (lỗi Reviewer phát hiện 2026-07-20).
    deptDetailHistoryPushed = false;
    currentDeptDetailCode = null;
    // Xóa luôn cache localStorage (không chỉ biến trong bộ nhớ) — phòng trường hợp thiết bị dùng
    // chung, người khác đăng nhập vai trò khác ngay sau đó không bị hydrate nhầm dữ liệu vai trò cũ.
    ['overview', 'deptList', 'deptMap', 'tkbc', 'projectList'].forEach(function (k) {
      try { localStorage.removeItem(CACHE_PREFIX + k); } catch (e) { /* bỏ qua */ }
    });
    closeSearchOverlay_(false);
    showView('view-login');
  }

  // Tự lấy App_Title MỚI NHẤT từ CONFIG_SETTINGS (Control) mỗi lần mở app — trang này giờ TĨNH
  // (host trên GitHub Pages), không còn được server thay sẵn {{APP_TITLE}} trong HTML trước khi
  // trả về như bản iframe cũ (THBC_WEBVIEW_HTML/Code.js doGet) nữa. Chạy SONG SONG, không chặn
  // luồng đăng nhập — lỗi ở đây (mất mạng) chỉ khiến tiêu đề giữ nguyên giá trị mặc định "Báo cáo
  // TDC" đã có sẵn trong HTML, không ảnh hưởng gì tới việc đăng nhập.
  callServer('webviewGetAppConfig', []).then(function (res) {
    if (res && res.ok && res.appTitle) {
      document.title = res.appTitle;
      $('app-title-h2').textContent = res.appTitle;
    }
  }).catch(function () { /* Giữ nguyên tiêu đề mặc định nếu lỗi mạng — không cần báo lỗi */ });

  // Đăng ký Service Worker — ĐIỀU KIỆN BẮT BUỘC để trình duyệt/Android coi đây là PWA "cài đặt
  // được" (Add to Home Screen tạo icon thật, mở full-screen không thanh địa chỉ), đồng thời cache
  // khung giao diện (HTML/CSS/JS, icon, manifest) để mở lại gần như tức thời ở lần sau — đáp ứng
  // yêu cầu "trải nghiệm như 1 app thông thường" (user 2026-07-19/20). Dữ liệu THẬT (fetch() gọi
  // Code.js) KHÔNG bị cache — sw.js chỉ cache đúng khung giao diện tĩnh, luôn xin dữ liệu mới từ
  // server mỗi lần dùng, không có rủi ro hiện dữ liệu cũ tưởng là mới.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* PWA vẫn dùng bình thường nếu đăng ký thất bại, chỉ mất phần cache/cài đặt vào màn hình chính */ });
    });
  }

  // ---- Phóng to/thu nhỏ chữ (nút +/- góc trái trên) — CHỈ CÓ Ở BẢN APP này, vì bản xem qua
  // trình duyệt gốc (WEBVIEW_THBC/WebviewHtml.js) tự có sẵn nút phóng to/nhỏ trang riêng của trình
  // duyệt, còn app cài vào màn hình chính (chạy standalone, không thanh địa chỉ/menu trình duyệt)
  // thì KHÔNG — user yêu cầu 2026-07-20. Dùng CSS "zoom" (không chuẩn nhưng Chrome/WebView Android
  // hỗ trợ đầy đủ — môi trường DUY NHẤT app này chạy) áp lên #app thay vì đổi từng font-size —
  // đơn giản hơn NHIỀU so với chuyển toàn bộ CSS hiện có (hàng trăm giá trị px đã tinh chỉnh qua
  // nhiều vòng sửa lỗi) sang rem, và scale ĐỀU mọi thứ (chữ, khoảng cách, icon) theo đúng tỉ lệ.
  var ZOOM_KEY = 'bc_webview_zoom';
  var ZOOM_MIN = 0.85, ZOOM_MAX = 1.5, ZOOM_STEP = 0.1;
  var zoomLevel = parseFloat(localStorage.getItem(ZOOM_KEY)) || 1;
  function applyZoom_() {
    $('app').style.zoom = zoomLevel;
    // .search-fab/.search-bar là position:fixed NHƯNG lại nằm BÊN TRONG #app (không như
    // .zoom-controls đặt hẳn ngoài #app) — CSS zoom trên Chrome vẫn phóng to/lệch vị trí luôn cả
    // con cháu fixed-position của tổ tiên bị zoom (khác hẳn transform:scale vốn tạo containing
    // block riêng), khiến nút tìm kiếm nổi bị to/lệch theo mức zoom thay vì giữ nguyên như mong
    // muốn (Reviewer phát hiện 2026-07-20) — bù lại bằng zoom nghịch đảo NGAY TRÊN 2 phần tử này để
    // triệt tiêu hiệu ứng phóng to của tổ tiên.
    var inverse = 1 / zoomLevel;
    $('search-fab').style.zoom = inverse;
    var bars = document.querySelectorAll('.search-bar');
    for (var i = 0; i < bars.length; i++) bars[i].style.zoom = inverse;
    // #toast cũng position:fixed BÊN TRONG #app như search-fab/search-bar ở trên — cùng lý do,
    // cùng cần bù zoom nghịch đảo, không thì mọi thông báo nổi (Đã gửi báo cáo, lỗi...) sẽ bị
    // to/lệch theo mức zoom (Reviewer phát hiện 2026-07-20, sót lại khi mới chỉ bù 2 phần tử trên).
    $('toast').style.zoom = inverse;
    try { localStorage.setItem(ZOOM_KEY, zoomLevel); } catch (e) { /* bỏ qua */ }
  }
  $('zoom-in-btn').addEventListener('click', function () {
    zoomLevel = Math.min(ZOOM_MAX, Math.round((zoomLevel + ZOOM_STEP) * 100) / 100);
    applyZoom_();
  });
  $('zoom-out-btn').addEventListener('click', function () {
    zoomLevel = Math.max(ZOOM_MIN, Math.round((zoomLevel - ZOOM_STEP) * 100) / 100);
    applyZoom_();
  });
  applyZoom_(); // Áp ngay từ đầu theo mức đã lưu lần trước (mặc định 1 = 100% nếu chưa từng chỉnh)

  if (currentPassword) verifyAndProceed(currentPassword, true);
  else showView('view-login');
})();
</script>
</body>
</html>
