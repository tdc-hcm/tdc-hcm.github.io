<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f6f8fb; color: #16202e;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center;
  }
  .box { padding: 24px; }
  .logo {
    width: 56px; height: 56px; border-radius: 14px; background: #1c4587; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 28px; height: 28px; }
  h1 { font-size: 17px; margin: 0 0 6px; color: #16202e; }
  p { font-size: 13px; color: #5b6b81; margin: 0; }
  .spinner {
    width: 22px; height: 22px; border: 3px solid #dbe2ec; border-top-color: #1c4587; border-radius: 50%;
    margin: 18px auto 0; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  noscript p { margin-top: 10px; }
  a { color: #1c4587; }
  @media (prefers-color-scheme: dark) {
    body { background: #0e1420; color: #e7ecf5; }
    h1 { color: #e7ecf5; }
    p { color: #8fa0ba; }
    .spinner { border-color: #2a3547; border-top-color: #7ea3e8; }
    a { color: #7ea3e8; }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">
      <svg viewBox="0 0 192 192" fill="none"><rect x="46" y="96" width="24" height="60" rx="4" fill="#fff"/><rect x="84" y="70" width="24" height="86" rx="4" fill="#fff"/><rect x="122" y="46" width="24" height="110" rx="4" fill="#fff"/></svg>
    </div>
    <h1>Báo cáo TDC</h1>

    <div class="spinner"></div>
    <noscript><p>Nếu không tự chuyển, <a href="https://script.google.com/macros/s/AKfycbyMUgkfpMN3DNvty64pQ6ZA7U4AMnPN0ScjIi0oLjOr45PA4XD7ctakN10w2IR2e0pm8g/exec">bấm vào đây</a>.</p></noscript>
  </div>
  <script>
    window.location.replace("https://script.google.com/macros/s/AKfycbyMUgkfpMN3DNvty64pQ6ZA7U4AMnPN0ScjIi0oLjOr45PA4XD7ctakN10w2IR2e0pm8g/exec");
